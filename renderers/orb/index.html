<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Multimodal Orb</title>
  <link rel="stylesheet" href="../../assets/themes.css">
  <link rel="stylesheet" href="orb.css">
</head>
<body>
  <div class="orb-container" id="orbContainer">
    <!-- Window Drag Bar -->
    <div class="drag-handle" title="Drag Orb Anywhere">
      <div class="drag-dots"></div>
    </div>

    <!-- WebGL / Canvas Energy Orb -->
    <canvas id="orbCanvas" width="300" height="300"></canvas>

    <!-- State & Audio Ripple Elements -->
    <div class="state-badge" id="stateBadge">IDLE</div>

    <!-- Sleek Right-Click Holographic Context Menu (Zero Emojis, Precision SVG) -->
    <div class="orb-context-menu" id="orbContextMenu" style="display: none;">
      <div class="menu-header">
        <span class="menu-header-title">ORB COMMAND</span>
        <span class="menu-header-sub" id="menuStatusSub">IDLE</span>
      </div>
      <div class="menu-divider"></div>
      <button class="menu-item" id="menuItemMic" title="Toggle Microphone">
        <svg class="menu-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span id="menuMicText">Mute Microphone</span>
      </button>
      <button class="menu-item" id="menuItemPin" title="Toggle Always on Top">
        <svg class="menu-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span id="menuPinText">Pin on Top</span>
      </button>
      <div class="menu-divider"></div>
      <button class="menu-item" id="menuItemMinimize" title="Universal Minimize to Floating Mini Toolbar">
        <svg class="menu-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"/>
          <polyline points="20 10 14 10 14 4"/>
          <line x1="14" y1="10" x2="21" y2="3"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        <span>Minimize All (Mini Bar)</span>
      </button>
      <button class="menu-item" id="menuItemTray" title="Minimize All Windows to System Tray">
        <svg class="menu-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M10 4v4"/>
          <path d="M2 8h20"/>
          <path d="M6 4v4"/>
        </svg>
        <span>Minimize to System Tray</span>
      </button>
      <div class="menu-divider"></div>
      <button class="menu-item" id="menuItemDeck" title="Open Workspace Command Deck">
        <svg class="menu-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <span>Workspace Command Deck</span>
      </button>
      <button class="menu-item" id="menuItemSettings" title="Open Left Settings & MCP Switchboard">
        <svg class="menu-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings & MCP Control</span>
      </button>
      <div class="menu-divider"></div>
      <button class="menu-item menu-item-danger" id="menuItemQuit" title="Exit Application">
        <svg class="menu-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <span>Exit Gemini Desktop</span>
      </button>
    </div>

    <!-- Unified Mini Floating Toolbar (Shown when Minimized to Top) -->
    <div class="mini-toolbar" id="miniToolbar" style="display: none;">
      <!-- Drag Grip -->
      <div class="mini-drag-grip" title="Drag to Reposition Toolbar">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- Live Status Badge -->
      <div class="mini-status" id="miniStatus">
        <div class="mini-status-dot" id="miniStatusDot"></div>
        <span class="mini-status-text" id="miniStatusText">LIVE</span>
      </div>

      <!-- Real-Time Wave Synth Canvas -->
      <div class="mini-synth-wrapper" id="miniSynthWrapper" title="Live Wave Synth (Double-click to Expand HUD)">
        <canvas id="waveSynthCanvas" width="300" height="56"></canvas>
      </div>

      <!-- Quick Action Controls -->
      <div class="mini-actions">
        <!-- Mic Toggle -->
        <button class="mini-btn" id="btnMiniMic" title="Toggle Microphone">
          <svg id="iconMiniMic" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>

        <!-- Expand / Restore Full HUD -->
        <button class="mini-btn mini-btn-expand" id="btnExpand" title="Restore Full Desktop HUD">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
        </button>

        <!-- Minimize to Tray -->
        <button class="mini-btn mini-btn-tray" id="btnMiniTray" title="Minimize All to System Tray">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M19 13H5v-2h14v2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- WebRTC Render Reference Audio Element for Hardware AEC3 Echo Cancellation -->
  <audio id="assistantAudioPlayer" autoplay playsinline style="display:none;"></audio>

  <script src="../../assets/theme-registry.js"></script>
  <script src="orb.js"></script>
</body>
</html>
